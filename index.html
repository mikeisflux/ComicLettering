<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComicLettering Studio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="toolbar">
  <div class="brand">Comic<span>Lettering</span></div>
  <div class="tb-group">
    <button id="btnNew" title="New document">New</button>
    <button id="btnOpen" title="Open a saved .json project">Open</button>
    <button id="btnSave" title="Save project as .json (Ctrl+S)">Save</button>
    <button id="btnExport" class="accent" title="Export current page as PNG">Export PNG</button>
  </div>
  <div class="tb-group">
    <button id="btnUndo" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button id="btnRedo" title="Redo (Ctrl+Y)">↷ Redo</button>
  </div>
  <div class="tb-group">
    <button id="btnZoomOut" title="Zoom out">−</button>
    <span id="zoomLabel">100%</span>
    <button id="btnZoomIn" title="Zoom in">+</button>
    <button id="btnZoomFit" title="Fit page in window">Fit</button>
  </div>
  <div class="tb-spacer"></div>
  <div class="tb-group hint">All work stays on your computer — nothing is uploaded.</div>
</header>

<div id="main">
  <aside id="leftbar">
    <div class="side-title">Pages</div>
    <div id="pageList"></div>
    <div class="page-actions">
      <button id="btnAddPage" title="Add page">+ Page</button>
      <button id="btnDelPage" title="Delete current page">Delete</button>
    </div>
  </aside>

  <div id="canvasArea">
    <div id="stage">
      <div id="page"></div>
      <div id="overlay" hidden></div>
    </div>
  </div>

  <aside id="inspector">
    <div class="side-title">Inspector</div>
    <div id="inspectorBody"></div>
  </aside>
</div>

<footer id="tray">
  <div class="tray-label">Add:</div>
  <button class="tray-btn" data-add="panel" title="Add a comic panel (frame)">
    <svg viewBox="0 0 40 30"><rect x="3" y="3" width="34" height="24" fill="#fff" stroke="#222" stroke-width="3"/></svg>
    <span>Panel</span>
  </button>
  <button class="tray-btn" data-add="image" title="Place a photo or drawing from your computer">
    <svg viewBox="0 0 40 30"><rect x="3" y="3" width="34" height="24" fill="#cde"/><circle cx="13" cy="11" r="4" fill="#fc3"/><path d="M6 25 L17 14 L24 21 L30 16 L36 25 Z" fill="#4a7"/></svg>
    <span>Image</span>
  </button>
  <span class="tray-sep"></span>
  <button class="tray-btn" data-add="speech" title="Speech balloon">
    <svg viewBox="0 0 40 30"><ellipse cx="20" cy="12" rx="16" ry="10" fill="#fff" stroke="#222" stroke-width="2"/><path d="M14 20 L10 28 L21 21 Z" fill="#fff" stroke="#222" stroke-width="2"/></svg>
    <span>Speech</span>
  </button>
  <button class="tray-btn" data-add="thought" title="Thought balloon">
    <svg viewBox="0 0 40 30"><ellipse cx="20" cy="11" rx="15" ry="9" fill="#fff" stroke="#222" stroke-width="2" stroke-dasharray="0"/><circle cx="12" cy="23" r="3" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="8" cy="28" r="1.7" fill="#fff" stroke="#222" stroke-width="1.5"/></svg>
    <span>Thought</span>
  </button>
  <button class="tray-btn" data-add="shout" title="Shout / burst balloon">
    <svg viewBox="0 0 40 30"><path d="M20 2 L24 8 L31 5 L29 12 L37 14 L30 18 L34 25 L26 22 L24 29 L20 23 L15 28 L14 21 L5 23 L11 16 L3 12 L12 10 L9 3 L17 8 Z" fill="#fff" stroke="#222" stroke-width="2"/></svg>
    <span>Shout</span>
  </button>
  <button class="tray-btn" data-add="whisper" title="Whisper balloon (dashed)">
    <svg viewBox="0 0 40 30"><ellipse cx="20" cy="12" rx="16" ry="10" fill="#fff" stroke="#222" stroke-width="2" stroke-dasharray="4 3"/><path d="M14 20 L10 28 L21 21 Z" fill="#fff" stroke="#222" stroke-width="2" stroke-dasharray="3 3"/></svg>
    <span>Whisper</span>
  </button>
  <button class="tray-btn" data-add="caption" title="Caption / narration box">
    <svg viewBox="0 0 40 30"><rect x="4" y="7" width="32" height="16" fill="#ffef9e" stroke="#222" stroke-width="2"/><line x1="8" y1="12" x2="32" y2="12" stroke="#999" stroke-width="2"/><line x1="8" y1="17" x2="26" y2="17" stroke="#999" stroke-width="2"/></svg>
    <span>Caption</span>
  </button>
  <button class="tray-btn" data-add="sfx" title="Sound-effect lettering (outlined display text)">
    <svg viewBox="0 0 40 30"><text x="20" y="22" text-anchor="middle" font-size="18" font-family="Impact, sans-serif" fill="#fc3" stroke="#222" stroke-width="1.5">POW!</text></svg>
    <span>SFX</span>
  </button>
  <div class="tb-spacer"></div>
  <div id="statusbar">Double-click any balloon to type · drag the orange dot to aim the tail · Del removes · drop image files onto the page</div>
</footer>

<input type="file" id="fileImage" accept="image/*" multiple hidden>
<input type="file" id="filePanelImage" accept="image/*" hidden>
<input type="file" id="fileOpen" accept=".json,application/json" hidden>

<script src="app.js"></script>
</body>
</html>

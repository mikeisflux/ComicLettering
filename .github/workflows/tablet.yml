# Builds the Android tablet app (see /tablet) — a Trusted Web Activity that
# renders lettermycomic.com full screen. Produces the Play-Store .aab and a
# sideloadable .apk as workflow artifacts. Run from the Actions tab or push
# a tablet-v* tag.
#
# Signing: the ANDROID_KEYSTORE_B64 + ANDROID_KEYSTORE_PASSWORD secrets hold
# the upload key. The job REFUSES to run without them — this repo is public,
# and a generated key attached as an artifact is downloadable by anyone
# (which is exactly what happened once; that key must never sign again).
# Generate the key locally, never in CI:
#   keytool -genkeypair -v -keystore android.keystore -alias lettermycomic \
#     -keyalg RSA -keysize 2048 -validity 10000
#   base64 -w0 android.keystore   → ANDROID_KEYSTORE_B64
# Version code: the workflow run number, so every build is newer than the
# last (Play refuses a re-used version code). Version name: the tablet-v*
# tag when the build comes from one, else the manifest's.
name: Tablet app (Android)

on:
  workflow_dispatch:
  push:
    tags: ["tablet-v*"]

# the release step publishes the APK to the android-latest release
permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tablet/droid
    env:
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Refuse to build without the signing secrets
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_B64 }}" ] || [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD must be set — CI never generates signing keys."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install -g @bubblewrap/cli
      - name: Point bubblewrap at the runner's JDK and Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          # bubblewrap validates the OLD SDK layout — it wants $SDK/tools
          # (running $SDK/tools/bin/sdkmanager) or $SDK/bin. The runner's
          # modern SDK only has versioned cmdline-tools dirs, so alias both
          # layouts onto the newest cmdline-tools.
          if [ ! -d "$SDK/cmdline-tools/latest" ]; then
            NEWEST=$(ls "$SDK/cmdline-tools" | sort -V | tail -1)
            sudo ln -sfn "$SDK/cmdline-tools/$NEWEST" "$SDK/cmdline-tools/latest"
          fi
          [ -e "$SDK/tools" ] || sudo ln -sfn "$SDK/cmdline-tools/latest" "$SDK/tools"
          echo "SDK=$SDK  tools -> $(readlink -f "$SDK/tools")"
          "$SDK/tools/bin/sdkmanager" --version
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath": "%s", "androidSdkPath": "%s"}\n' "$JAVA_HOME" "$SDK" > ~/.bubblewrap/config.json
      - name: Keystore from the secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android.keystore
          keytool -list -v -keystore android.keystore -alias lettermycomic -storepass "$KS_PASS" \
            | grep -E "SHA256:" > assetlinks-fingerprint.txt || true
      - name: Stamp the version (code = run number, name = tag when tagged)
        run: |
          CODE=${{ github.run_number }}
          NAME=$(node -p "require('./twa-manifest.json').appVersionName")
          case "${{ github.ref }}" in refs/tags/tablet-v*) NAME="${GITHUB_REF#refs/tags/tablet-v}";; esac
          node -e "const f='twa-manifest.json',m=require('./'+f);m.appVersionCode=$CODE;m.appVersionName='$NAME';require('fs').writeFileSync(f,JSON.stringify(m,null,2)+'\n')"
          echo "versionCode=$CODE versionName=$NAME"
      - name: Generate the Android project from twa-manifest.json
        run: bubblewrap update --skipVersionUpgrade
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KS_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KS_PASS }}
      - name: Build .aab + .apk
        run: bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KS_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KS_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: lettermycomic-android
          path: |
            tablet/droid/*.aab
            tablet/droid/*.apk
            tablet/droid/assetlinks-fingerprint.txt
          if-no-files-found: error
      # publish the signed APK at a stable URL so the site's Get the App
      # page can offer a direct Android download (sideload) alongside Play
      - name: Publish APK to the android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: LetterMyComic for Android (direct download)
          body: >
            Signed Android app, straight from the build. Play-Store release
            of the same app: https://play.google.com/store/apps/details?id=com.lettermycomic.app
          files: tablet/droid/app-release-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: iOS — Build & Upload to App Store Connect

# Manual trigger: Actions tab → this workflow → Run workflow.
# Builds the ios/ wrapper on a macOS runner, signs it with certificates
# managed by fastlane match (stored encrypted on the ios-certs branch),
# and uploads the build to App Store Connect (TestFlight → submit from
# appstoreconnect.apple.com).
on:
  workflow_dispatch:

permissions:
  contents: write   # match pushes the encrypted certs to the ios-certs branch

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      # Apple rejects uploads built with anything older than the iOS 26 SDK;
      # the runner's default Xcode lags behind, but newer ones are installed.
      - name: Select the newest Xcode on the runner
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Selecting $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install pods
        run: pod install

      - name: Build, sign & upload
        env:
          KEY_ID: ${{ secrets.KEY_ID }}
          ISSUER_ID: ${{ secrets.ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: fastlane release

      - name: Keep the signed build as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LetterMyComic-ipa
          path: ios/build/*.ipa
          if-no-files-found: ignore
